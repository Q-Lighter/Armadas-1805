<!doctype html>
<html lang="en" data-ui-size="medium">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="armadas-build" content="__BUILD_ID__" />
    <meta name="armadas-commit" content="__BUILD_COMMIT__" />
    <title>Armada's 1805</title>
    <link rel="stylesheet" href="./paper.css" />
  </head>
  <body class="game">
    <div id="game-root"></div>

    <header class="hud hud-top paper">
      <div class="room-label">
        <p class="kicker">Armada's 1805</p>
        <p class="room">Room <strong id="room-code">test</strong></p>
      </div>

      <button class="btn" id="follow-btn" type="button" aria-pressed="true">
        Follow my ship
      </button>

      <button class="btn" id="chart-btn" type="button" aria-pressed="false">
        Chart
      </button>

      <div class="size-picker" role="group" aria-label="UI size">
        <button class="btn size-option" type="button" data-size="small" aria-pressed="false">
          S
        </button>
        <button class="btn size-option" type="button" data-size="medium" aria-pressed="true">
          M
        </button>
        <button class="btn size-option" type="button" data-size="large" aria-pressed="false">
          L
        </button>
      </div>

      <p class="status" id="status" data-state="loading">Connecting…</p>
    </header>

    <section class="hud hud-ship paper" aria-label="Your ship">
      <h2>Your ship</h2>
      <dl class="readout">
        <dt>Speed</dt>
        <dd id="speed">–</dd>
        <dt>Heading</dt>
        <dd id="heading">–</dd>
      </dl>

      <div class="wind-row">
        <svg class="wind-arrow" viewBox="0 0 24 24" aria-hidden="true">
          <g id="wind-arrow">
            <path d="M12 3 L18 15 L12 12 L6 15 Z" fill="currentColor" />
          </g>
        </svg>
        <span id="wind-label">Wind –</span>

        <svg
          class="compass"
          viewBox="0 0 72 72"
          role="img"
          aria-label="Compass rose showing your heading"
        >
          <circle cx="36" cy="36" r="32" fill="none" stroke="currentColor" stroke-width="1" />
          <circle
            cx="36"
            cy="36"
            r="25"
            fill="none"
            stroke="currentColor"
            stroke-width="0.6"
            stroke-dasharray="2 4"
          />
          <g id="compass-needle">
            <path d="M36 10 L41 37 L36 33 L31 37 Z" fill="#8c1d1d" />
          </g>
          <text x="36" y="8" text-anchor="middle">N</text>
          <text x="65" y="39" text-anchor="middle">E</text>
          <text x="36" y="70" text-anchor="middle">S</text>
          <text x="7" y="39" text-anchor="middle">W</text>
        </svg>
      </div>
    </section>

    <p class="chart-notice" id="notice" role="status" aria-live="polite" hidden></p>

    <!-- Shown when a newer build is live. It never reloads by itself. -->
    <button class="version-notice paper" id="version-notice" type="button" hidden>
      A new version is available: tap to reload
    </button>

    <!-- TEMP-DEBUG: test and dev rooms only. The client reveals nothing extra. -->
    <p class="hud fog-debug" id="fog-debug" hidden></p>

    <p class="hud hint">Tap to sail. Drag to pan. Pinch or scroll to zoom.</p>

    <script src="./main.js" defer></script>
  </body>
</html>
